<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100">
  <style>
    /* logo-2.png is white — invert to dark in light browser UI, keep white in dark */
    image {
      filter: none;
    }
    @media (prefers-color-scheme: light) {
      image {
        filter: invert(1);
      }
    }
  </style>
  <image href="/assets/logo-2.png" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/>
</svg>
